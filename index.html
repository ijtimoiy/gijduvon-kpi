<!DOCTYPE html>
<html lang="uz">
<head>

  <title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #eef4ff, #f8fafc);

    .box {

      height: 80px;
      margin: 0 auto 22px;
      border-radius: 20px;
      background: #2563eb;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      font-weight: bold;
    }

    h1 {
      margin: 0;
      color: #111827;
      font-size: 24px;
      line-height: 1.4;
    }

    p {
      color: #6b7280;
      line-height: 1.6;
      margin: 14px 0 28px;
    }

    .btn {
      display: inline-block;
      padding: 15px 30px;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
    }

    .btn:hover {
      background: #1d4ed8;
    }

    .footer {
      margin-top: 22px;
      color: #9ca3af;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="box">

    </div>

    <p>
      Ijtimoiy xodimlari KPI ko‘rsatkichlari

    <a

      target="_blank"
      rel="noopener noreferrer">
      TIZIMGA KIRISH
    </a>

    <div class="footer">
      G‘ijduvon tuman "INSON" ijtimoiy xizmatlar markazi

</html>
